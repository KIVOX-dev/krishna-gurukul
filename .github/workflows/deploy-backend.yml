name: Deploy backend (Docker Hub, Zoho Catalyst AppSail)

on:
  push:
    branches: [main]
    paths: ['backend/**', 'shared/**', 'Dockerfile.backend', 'package.json', 'package-lock.json', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/krishna-gurukul-api
  # folder that holds .catalystrc / catalyst.json (repo root by default; change if the Catalyst project sits in a sub folder)
  CATALYST_DIR: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Typecheck backend
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci -w backend -w shared --include-workspace-root=false
      - run: npm run typecheck -w backend

      - name: Build and push Docker image
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Point AppSail at this build
        working-directory: ${{ env.CATALYST_DIR }}
        run: |
          f=$(find . -name app-config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::No app-config.json found. Commit the Catalyst project files (catalyst.json, .catalystrc and the AppSail folder with app-config.json) to this repo, or set CATALYST_DIR to the folder that holds them."
            find . -maxdepth 3 -not -path "./node_modules/*" -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "app-config: $f"
          sed -i -E "s#docker://[^\"]+#docker://${IMAGE}:${GITHUB_SHA}#" "$f"
          cat "$f"

      - name: Deploy to Catalyst
        working-directory: ${{ env.CATALYST_DIR }}
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: catalyst deploy --only appsail --token "$CATALYST_TOKEN"

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.API_HEALTH_URL }}" || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 20
          done
          echo "Health check failed"; exit 1
